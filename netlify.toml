[build]
  command = "echo 'No build step - Express app runs as a Netlify Function'"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # zisi keeps the repo's file layout, so __dirname-relative paths
  # (views/, db/schema.sql) and the better-sqlite3 native binary just work.
  node_bundler = "zisi"
  # db/migrations is loaded with a dynamic require, so list it explicitly.
  included_files = ["views/**", "db/schema.sql", "db/migrations/**"]

# Static assets in public/ are served by the CDN; everything else goes to Express.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200

# Daily automations (estimate follow-ups, maintenance visit jobs, overdue
# invoices, certification and training reminders). 11:00 UTC each day;
# the function itself skips a second run on the same company-local date.
[functions."daily"]
  schedule = "0 11 * * *"

# Installable app: browsers must re-check the service worker on every
# visit so updates reach installed phones promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
