<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1f6feb" />
<title>You're offline</title>
<link rel="icon" type="image/png" href="/icons/favicon-64.png" />
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f6f8; color: #1c2530; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 1.5rem; box-sizing: border-box; }
  .card { background: #fff; border: 1px solid #dbe1e8; border-radius: 12px; padding: 2rem 1.5rem; max-width: 380px; width: 100%; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.35rem; margin: 1rem 0 0.5rem; }
  p { color: #5c6b7a; line-height: 1.5; margin: 0 0 1.25rem; }
  button { background: #1f6feb; color: #fff; border: 0; border-radius: 8px; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>There's no internet connection right now. Check your signal or Wi-Fi, then try again. Nothing you've already saved has been lost.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
